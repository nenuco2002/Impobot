<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Vencimientos ARCA 2026 — FiscalAR</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
:root{--ink:#0a0f1a;--card:#131e31;--border:#1e2d47;--text:#e8edf5;--sub:#8899b4;--cyan:#00c9b8;--amber:#f59e0b;--green:#10b981;--red:#ef4444;--purple:#8b5cf6}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--ink);color:var(--text);font-family:'Inter',sans-serif;font-size:14px;min-height:100vh}
.topnav{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(10,15,26,.95);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;padding:0 20px;height:54px}
.back-btn{color:var(--sub);text-decoration:none;font-size:.78rem;font-weight:500;padding:5px 10px;border-radius:7px;transition:all .15s}
.back-btn:hover{color:var(--text);background:#1a2744}
.nav-title{font-size:.88rem;font-weight:700;color:#fff}
.nav-sub{font-size:.65rem;color:var(--sub)}
.nav-badge{margin-left:auto;background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.25);color:var(--amber);font-size:.6rem;font-weight:700;padding:2px 8px;border-radius:5px;text-transform:uppercase}
.main{margin-top:54px;padding:18px;max-width:1100px;margin-left:auto;margin-right:auto}
.filters{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap;align-items:center}
.filter-btn{background:rgba(255,255,255,.05);border:1px solid var(--border);color:var(--sub);padding:6px 14px;border-radius:8px;font-size:.75rem;font-weight:600;cursor:pointer;transition:all .15s;font-family:'Inter',sans-serif}
.filter-btn.active,.filter-btn:hover{background:rgba(0,201,184,.1);border-color:rgba(0,201,184,.3);color:var(--cyan)}
select.filter-sel{background:#0a0f1a;border:1px solid var(--border);color:var(--text);padding:6px 12px;border-radius:8px;font-size:.75rem;outline:none;font-family:'Inter',sans-serif}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
.mes-card{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden}
.mes-hd{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.mes-nombre{font-size:.88rem;font-weight:800;color:#fff}
.mes-cant{font-size:.65rem;color:var(--sub);background:rgba(255,255,255,.05);padding:2px 8px;border-radius:5px}
.venc-list{padding:8px}
.venc-item{display:flex;align-items:flex-start;gap:10px;padding:8px 10px;border-radius:8px;margin-bottom:4px;transition:background .12s}
.venc-item:hover{background:rgba(255,255,255,.03)}
.venc-dia{font-size:1rem;font-weight:800;color:#fff;width:28px;flex-shrink:0;font-family:'JetBrains Mono',monospace}
.venc-info{flex:1}
.venc-nombre{font-size:.76rem;font-weight:600;color:var(--text);line-height:1.3}
.venc-det{font-size:.66rem;color:var(--sub);margin-top:2px}
.tag{display:inline-block;font-size:.55rem;font-weight:700;padding:1px 5px;border-radius:4px;margin-right:3px;text-transform:uppercase;letter-spacing:.04em}
.tag-iva{background:rgba(0,201,184,.15);color:var(--cyan)}
.tag-gan{background:rgba(139,92,246,.15);color:var(--purple)}
.tag-ss{background:rgba(245,158,11,.15);color:var(--amber)}
.tag-iibb{background:rgba(16,185,129,.15);color:var(--green)}
.tag-mon{background:rgba(239,68,68,.15);color:var(--red)}
.tag-sdo{background:rgba(255,255,255,.1);color:var(--sub)}
.hoy-badge{background:rgba(0,201,184,.15);border:1px solid rgba(0,201,184,.3);color:var(--cyan);font-size:.6rem;font-weight:700;padding:2px 7px;border-radius:5px}
.prox-badge{background:rgba(245,158,11,.12);border:1px solid rgba(245,158,11,.25);color:var(--amber);font-size:.6rem;font-weight:700;padding:2px 7px;border-radius:5px}
.mes-actual{border-color:rgba(0,201,184,.3)}
.mes-actual .mes-hd{background:rgba(0,201,184,.05)}
.search-bar{flex:1;min-width:200px;background:#0a0f1a;border:1px solid var(--border);color:var(--text);padding:7px 12px;border-radius:8px;font-size:.8rem;outline:none;font-family:'Inter',sans-serif}
.search-bar:focus{border-color:var(--cyan)}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:14px;font-size:.7rem}
.legend-item{display:flex;align-items:center;gap:5px;color:var(--sub)}
</style>
</head>
<body>
<div style="position:fixed;top:0;left:0;right:0;height:40px;background:rgba(7,9,15,.92);border-bottom:1px solid #1c2535;display:flex;align-items:center;padding:0 16px;gap:10px;z-index:9999;font-family:Inter,system-ui,sans-serif;backdrop-filter:blur(12px)">
  <a href="../index.html" style="color:#64748b;font-size:.76rem;font-weight:500;text-decoration:none;padding:3px 8px;border-radius:5px;display:flex;align-items:center;gap:5px;transition:color .15s" onmouseover="this.style.color='#e2e8f4'" onmouseout="this.style.color='#64748b'">
    🤖 ← ImpoBot
  </a>
  <span style="color:#1c2535">|</span>
  <span id="tool-nav-title" style="color:#e2e8f4;font-size:.78rem;font-weight:700"></span>
  <span style="margin-left:auto;background:rgba(99,102,241,.1);border:1px solid rgba(99,102,241,.2);color:#818cf8;font-size:.6rem;font-weight:700;padding:2px 8px;border-radius:4px">ARCA 2026</span>
</div>
<div style="height:40px"></div>
<script>document.getElementById("tool-nav-title").textContent="📅 Vencimientos ARCA 2026";</script>
<nav class="topnav">

  <div class="nav-badge">2026</div>
</nav>
<div class="main">
  <div class="filters">
    <input class="search-bar" id="search" placeholder="🔍 Buscar vencimiento..." oninput="renderGrid()"/>
    <button class="filter-btn active" onclick="setFiltro('todos',this)">Todos</button>
    <button class="filter-btn" onclick="setFiltro('IVA',this)">IVA</button>
    <button class="filter-btn" onclick="setFiltro('GAN',this)">Ganancias</button>
    <button class="filter-btn" onclick="setFiltro('SS',this)">Seg. Social</button>
    <button class="filter-btn" onclick="setFiltro('MON',this)">Monotributo</button>
    <select class="filter-sel" id="sel-mes" onchange="renderGrid()">
      <option value="">Todos los meses</option>
      ${Array.from({length:12},(_,i)=>{
        const m=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'][i];
        return `<option value="${i}">${m}</option>`;
      }).join('')}
    </select>
  </div>
  <div class="legend">
    <div class="legend-item"><span class="tag tag-iva">IVA</span>IVA</div>
    <div class="legend-item"><span class="tag tag-gan">GAN</span>Ganancias</div>
    <div class="legend-item"><span class="tag tag-ss">SS</span>Seg. Social</div>
    <div class="legend-item"><span class="tag tag-iibb">IIBB</span>Ing. Brutos</div>
    <div class="legend-item"><span class="tag tag-mon">MON</span>Monotributo</div>

  </div>
  <div class="grid" id="grid"></div>
</div>

  // MAYO
  {m:4,d:15,n:'IVA — DJ mensual',det:'CUIT terminados en 0-1',tags:['IVA']},
  {m:4,d:16,n:'IVA — DJ mensual',det:'CUIT terminados en 2-3',tags:['IVA']},

  {m:5,d:22,n:'Autónomos — cuota mensual',det:'Pago aporte mayo',tags:['GAN']},
  {m:5,d:22,n:'Monotributo — cuota mensual',det:'Pago cuota mayo',tags:['MON']},

  // NOVIEMBRE
  {m:10,d:16,n:'IVA — DJ mensual',det:'CUIT terminados en 0-1',tags:['IVA']},
  {m:10,d:17,n:'IVA — DJ mensual',det:'CUIT terminados en 2-3',tags:['IVA']},
  {m:10,d:18,n:'IVA — DJ mensual',det:'CUIT terminados en 4-5',tags:['IVA']},
  {m:10,d:22,n:'Autónomos — cuota mensual',det:'Pago aporte octubre',tags:['GAN']},
  {m:10,d:22,n:'Monotributo — cuota mensual',det:'Pago cuota octubre',tags:['MON']},

const TAG_MAP = {IVA:'tag-iva',GAN:'tag-gan',SS:'tag-ss',IIBB:'tag-iibb',MON:'tag-mon',SDO:'tag-sdo'};
let filtroActivo = 'todos';

const hoy = new Date();
const mesHoy = hoy.getMonth();
const diaHoy = hoy.getDate();

function setFiltro(f, btn){
  filtroActivo = f;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderGrid();
}

function renderGrid(){
  const search = document.getElementById('search').value.toLowerCase();
  const selMes = document.getElementById('sel-mes').value;
  const grid = document.getElementById('grid');

  let meses = {};
  VENC.forEach(v=>{
    if(filtroActivo !== 'todos' && !v.tags.includes(filtroActivo)) return;
    if(search && !v.n.toLowerCase().includes(search) && !v.det.toLowerCase().includes(search)) return;
    if(selMes !== '' && v.m !== parseInt(selMes)) return;
    if(!meses[v.m]) meses[v.m] = [];
    meses[v.m].push(v);
  });

  grid.innerHTML = Object.entries(meses).sort(([a],[b])=>a-b).map(([m,vs])=>{
    const mes = parseInt(m);
    const esActual = mes === mesHoy;
    const sorted = vs.sort((a,b)=>a.d-b.d);
    return `<div class="mes-card ${esActual?'mes-actual':''}">
      <div class="mes-hd">
        <span class="mes-nombre">${MESES[mes]} 2026</span>
        ${esActual?'<span class="hoy-badge">Mes actual</span>':''}
        <span class="mes-cant">${sorted.length} venc.</span>
      </div>
      <div class="venc-list">
        ${sorted.map(v=>{
          const esHoy = mes===mesHoy && v.d===diaHoy;
          const esProx = mes===mesHoy && v.d>diaHoy && v.d<=diaHoy+7;
          return `<div class="venc-item">
            <div class="venc-dia">${v.d}</div>
            <div class="venc-info">
              <div class="venc-nombre">
                ${v.tags.map(t=>`<span class="tag ${TAG_MAP[t]||'tag-sdo'}">${t}</span>`).join('')}
                ${v.n}
                ${esHoy?'<span class="hoy-badge" style="margin-left:4px">Hoy</span>':''}
                ${esProx?'<span class="prox-badge" style="margin-left:4px">Esta semana</span>':''}
              </div>
              <div class="venc-det">${v.det}</div>
            </div>
          </div>`;
        }).join('')}
      </div>
    </div>`;
  }).join('') || '<div style="grid-column:1/-1;text-align:center;padding:40px;color:var(--sub)">Sin vencimientos para el filtro seleccionado</div>';
}
renderGrid();
</script>
</body>
</html>
