# ImpoBot — impobot.com.ar
# Configuración Netlify

[build]
  publish = "."

[functions]
  directory = "netlify/functions"

# Redirigir HTTP → HTTPS y www
[[redirects]]
  from = "http://impobot.com.ar/*"
  to   = "https://www.impobot.com.ar/:splat"
  status = 301
  force  = true

[[redirects]]
  from = "https://impobot.com.ar/*"
  to   = "https://www.impobot.com.ar/:splat"
  status = 301
  force  = true

# Headers de seguridad
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/tools/*.html"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/tools/*/*.js"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-store, must-revalidate"

[[headers]]
  for = "/bot.js"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"
